[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "etfolio-backend"
version = "0.1.0"
description = "ETFolio backend service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "apscheduler>=3.10.4",
    "yfinance==0.2.54",
    "httpx>=0.27.0",
    "argon2-cffi>=23.1.0",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.2.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.5",
    "respx>=0.21.0",
]
